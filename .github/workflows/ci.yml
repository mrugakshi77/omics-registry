name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omics
          POSTGRES_PASSWORD: omics
          POSTGRES_DB: omics_registry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install dependencies
        run: pixi install

      - name: Lint with ruff
        run: pixi run ruff check .

      - name: Type-check with mypy
        run: pixi run mypy src

      - name: Run tests
        env:
          OMICS_DATABASE_URL: postgresql+psycopg2://omics:omics@localhost:5432/omics_registry_test
        run: pixi run pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t omics-registry .
